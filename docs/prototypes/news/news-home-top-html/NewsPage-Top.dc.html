<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>新闻与报告 · 列表页</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&amp;family=Noto+Sans+SC:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F4F1EA}
a{color:#3B3190}a:hover{color:#281F6E}
</style>
</helmet>
<div style="width: 1440px; height: 3160px; box-sizing: border-box; background: #F4F1EA; color: #1A1726; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; display: flex; flex-direction: column">

  <header style="position: relative; overflow: hidden; background: linear-gradient(135deg, #2A2268 0%, #3B3190 60%, #4B3EA3 100%); color: #FFFFFF; padding: 64px 96px 56px">
    <div style="position: absolute; right: -180px; top: -240px; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(closest-side, rgba(242,211,138,0.2), rgba(242,211,138,0) 100%)"></div>
    <div style="position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: 48px">
      <div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px">
        <span style="font-size: 13px; color: #CFC8EE">首页 <span style="color: rgba(255,255,255,0.4)">/</span> 新闻与报告</span>
        <h1 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 900; font-size: 56px">新闻与报告</h1>
        <p style="margin: 0; font-size: 16px; line-height: 1.85; color: #DAD4F2">机构公告、调查报告、专题评论、国际声援与三退新闻。全部内容注明来源与日期，可自由转载与翻译。</p>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; width: 340px; padding: 14px 18px; border-radius: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); color: #CFC8EE; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC8EE" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        搜索文章、人物或地点
      </div>
    </div>
  </header>

  <nav aria-label="新闻分类" style="background: #FFFFFF; border-bottom: 1px solid #E3DCCE; padding: 0 96px; display: flex; gap: 36px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
      <a href="#" style="font-size: 15px; text-decoration: none; padding: 20px 0 18px; color: {{t.color}}; font-weight: {{t.weight}}; border-bottom: 2px solid {{t.line}}">{{t.name}}</a>
    </sc-for>
  </nav>

  <div style="padding: 72px 96px 112px; display: flex; flex-direction: column; gap: 96px">

    <section style="display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; align-items: center; gap: 16px">
        <span style="font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 26px">精选报道</span>
        <span style="flex-grow: 1; height: 1px; background: #1A1726"></span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.2em; color: #6B6578">FEATURED</span>
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 48px">
        <a href="#" style="display: flex; flex-direction: column; gap: 20px; color: #1A1726; text-decoration: none">
          <div style="position: relative; height: 500px; border-radius: 6px; overflow: hidden; box-shadow: 0 30px 60px -36px rgba(26,23,38,0.45)">
            <img src="{{main.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
            <span style="position: absolute; left: 20px; top: 20px; background: #3B3190; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.18em; padding: 7px 12px; border-radius: 3px">头条</span>
          </div>
          <span style="display: flex; align-items: center; gap: 12px; font-size: 14px"><span style="color: #3B3190; font-weight: 500">{{main.cat}}</span><span style="width: 1px; height: 12px; background: #CFC8BA"></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #6B6578">{{main.date}}</span></span>
          <h2 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 900; font-size: 40px; line-height: 1.35">{{main.t}}</h2>
          <p style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 17px; line-height: 1.95; color: #45404F; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{main.ex}}</p>
          <span style="align-self: flex-start; font-size: 14px; color: #3B3190; padding-top: 4px">阅读全文 →</span>
        </a>
        <div style="display: flex; flex-direction: column; gap: 28px">
          <sc-for list="{{side}}" as="s" hint-placeholder-count="2">
            <a href="#" style="display: flex; flex-direction: column; gap: 12px; color: #1A1726; text-decoration: none; padding-bottom: 28px; border-bottom: {{s.rule}}">
              <img src="{{s.img}}" alt="" style="width: 100%; aspect-ratio: 16 / 9; height: auto; object-fit: cover; border-radius: 6px; display: block">
              <span style="display: flex; align-items: center; gap: 10px; font-size: 13px"><span style="color: #3B3190; font-weight: 500">{{s.cat}}</span><span style="width: 1px; height: 11px; background: #CFC8BA"></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6B6578">{{s.date}}</span></span>
              <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 19px; line-height: 1.55">{{s.t}}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; align-items: center; gap: 16px">
        <span style="display: flex; align-items: center; gap: 10px; font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 26px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #C9A04E; box-shadow: 0 0 0 5px rgba(201,160,78,0.2)"></span>最新发布</span>
        <span style="font-size: 14px; color: #6B6578">每日更新</span>
        <span style="flex-grow: 1; height: 1px; background: #1A1726"></span>
        <a href="#" style="font-size: 14px; color: #3B3190; text-decoration: none">查看全部 →</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 56px; background: #FFFEFA; border: 1px solid #E3DCCE; border-radius: 10px; padding: 12px 40px; box-shadow: 0 1px 2px rgba(26,23,38,0.04), 0 18px 40px -30px rgba(26,23,38,0.25)">
        <sc-for list="{{latest}}" as="l" hint-placeholder-count="10">
          <a href="#" style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 24px 0; border-bottom: {{l.rule}}; color: #1A1726; text-decoration: none">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #6B6578">{{l.d}}</span>
            <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 20px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{l.t}}</span>
          </a>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; align-items: flex-end; gap: 16px">
        <span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 26px">精彩保留</span><span style="font-size: 14px; color: #6B6578">值得反复阅读的深度内容，长期置顶</span></span>
        <span style="flex-grow: 1; height: 1px; background: #1A1726; margin-bottom: 8px"></span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.2em; color: #6B6578; margin-bottom: 2px">EDITOR'S ARCHIVE</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px">
        <sc-for list="{{keep}}" as="k" hint-placeholder-count="6">
          <a href="#" style="display: flex; flex-direction: column; background: #FFFEFA; border: 1px solid #E3DCCE; border-top: 2px solid #3B3190; border-radius: 8px; overflow: hidden; color: #1A1726; text-decoration: none; box-shadow: 0 1px 2px rgba(26,23,38,0.04), 0 18px 40px -26px rgba(26,23,38,0.28)">
            <div style="position: relative; height: 220px">
              <img src="{{k.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
              <span style="position: absolute; right: 14px; top: 14px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,254,250,0.92); display: flex; align-items: center; justify-content: center">
                <svg width="14" height="16" viewBox="0 0 14 16" fill="#C9A04E"><path d="M1 1h12v14l-6-4-6 4z"></path></svg>
              </span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px; padding: 22px 24px 20px; flex-grow: 1">
              <span style="font-size: 13px; color: #3B3190; font-weight: 500">{{k.cat}}</span>
              <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 20px; line-height: 1.55; flex-grow: 1">{{k.t}}</span>
              <span style="display: flex; justify-content: space-between; font-size: 13px; color: #6B6578; padding-top: 14px; border-top: 1px solid #EAE4D8"><span style="font-family: 'JetBrains Mono', monospace">{{k.d}}</span><span style="color: #3B3190">阅读 →</span></span>
            </div>
          </a>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>
