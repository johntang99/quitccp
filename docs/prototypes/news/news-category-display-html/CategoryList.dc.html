        <div style="display: flex; align-items: baseline; gap: 18px">

      <div style="display: flex; align-items: center; gap: 10px; width: 300px; padding: 12px 16px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); color: #CFC8EE; font-size: 14px">

  </header>

  <div style="padding: 0 96px; margin-top: -64px; position: relative">

      <span style="position: relative; display: block">
        <img src="{{lead.img}}" alt="" style="width: 100%; aspect-ratio: 16 / 9; height: auto; object-fit: cover; display: block">
        <span style="position: absolute; left: 18px; top: 18px; background: #F2D38A; color: #1A1638; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 3px">本栏头条</span>
      </span>
      <span style="display: flex; flex-direction: column; gap: 16px; padding: 40px 44px">
        <span style="display: flex; align-items: center; gap: 10px; font-size: 13px"><span style="color: #3B3190; font-weight: 500">红朝败相</span><span style="width: 1px; height: 11px; background: #CFC8BA"></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6B6578">{{lead.date}}</span></span>
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 900; font-size: 32px; line-height: 1.4">{{lead.t}}</span>
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 15px; line-height: 1.85; color: #4A4458; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden">{{lead.ex}}</span>

            <img src="{{a.img}}" alt="" style="width: 240px; aspect-ratio: 16 / 9; height: auto; object-fit: cover; display: block">
            <sc-if value="{{a.video}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,0.72); color: #FFFFFF; font-size: 11px; padding: 3px 7px; border-radius: 3px">▶ 视频</span></sc-if>

            <span style="font-size: 14px; line-height: 1.75; color: #6B6578; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{a.ex}}</span>
            <span style="display: flex; align-items: center; gap: 10px; margin-top: 2px; font-size: 12px">
              <span style="font-family: 'JetBrains Mono', monospace; color: #8A8398">{{a.date}}</span>
              <span style="color: #3B3190; background: #EEEAF6; padding: 3px 9px; border-radius: 999px">{{a.tag}}</span>
              <span style="margin-left: auto; color: #3B3190; font-size: 13px">阅读 →</span>
            </span>
          </span>
        </a>
      </sc-for>

        </span>
      </nav>
    </div>

        </sc-for>
      </div>
    </aside>
  </div>
</div>
