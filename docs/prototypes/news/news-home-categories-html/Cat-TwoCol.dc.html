<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&amp;family=Noto+Sans+SC:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F4F1EA}
a{color:#3B3190}a:hover{color:#281F6E}
</style>
</helmet>
<div style="width: 1440px; height: 3260px; box-sizing: border-box; padding: 96px; background: #F4F1EA; color: #1A1726; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 56px">
  <div style="display: flex; align-items: center; gap: 16px">
    <span style="font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 32px">按栏目浏览</span>
    <span style="flex-grow: 1; height: 1px; background: #1A1726"></span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.2em; color: #6B6578">6 个栏目</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 72px 56px; align-items: start">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
      <section style="display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; border-bottom: 2px solid #1A1726">
          <span style="display: flex; align-items: baseline; gap: 12px"><span style="font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 26px">{{c.name}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: #3B3190">{{c.en}}</span></span>
          <a href="{{c.href}}" style="font-size: 14px; color: #3B3190; text-decoration: none">更多 →</a>
        </div>
        <a href="#" style="display: flex; flex-direction: column; gap: 12px; color: #1A1726; text-decoration: none">
          <img src="{{c.lead.src}}" alt="" style="width: 100%; aspect-ratio: 16 / 9; height: auto; object-fit: cover; border-radius: 6px; display: block; box-shadow: 0 24px 48px -32px rgba(26,23,38,0.45)">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6B6578; margin-top: 4px">{{c.lead.date}}</span>
          <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 900; font-size: 24px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{c.lead.t}}</span>
        </a>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{c.rest}}" as="r" hint-placeholder-count="3">
            <a href="#" style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 20px 0; border-top: 1px solid #D9D2C4; color: #1A1726; text-decoration: none">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6B6578">{{r.date}}</span>
              <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 20px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{r.t}}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
</div>
