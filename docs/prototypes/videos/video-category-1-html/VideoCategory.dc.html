<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>视频栏目页 · 三退前线</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&amp;family=Noto+Sans+SC:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#2B2367}
a{color:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 1900px; box-sizing: border-box; background: {{th.bg}}; color: {{th.text}}; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="position: absolute; left: 50%; top: -420px; width: 1400px; height: 900px; margin-left: -700px; border-radius: 50%; background: radial-gradient(closest-side, {{th.glow}}, rgba(0,0,0,0) 100%)"></div>

  <header style="position: relative; background: {{th.head}}; padding: 36px 96px 28px; display: flex; flex-direction: column; gap: 22px; border-bottom: 1px solid {{th.border}}">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 13px; color: {{th.muted}}">首页 <span style="opacity: 0.5">/</span> 视频 <span style="opacity: 0.5">/</span> 三退前线</span>
      <div role="group" aria-label="背景颜色" style="display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: {{th.field}}; border: 1px solid {{th.border}}">
        <span style="font-size: 12px; color: {{th.muted}}; padding: 0 8px 0 10px">背景</span>
        <sc-for list="{{toggles}}" as="o" hint-placeholder-count="3">
          <button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; align-items: center; gap: 8px; border: 0; cursor: pointer; font-family: inherit; font-size: 13px; padding: 7px 14px; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{o.sw}}; box-shadow: 0 0 0 1px rgba(128,120,160,0.6)"></span>{{o.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 40px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; gap: 18px">
          <h1 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 900; font-size: 48px; color: {{th.title}}">三退前线</h1>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{th.acc}}">241 部 · 第 1 / 11 页</span>
        </div>
        <p style="margin: 0; font-size: 15px; color: {{th.muted}}">服务点现场、义工纪实与当事人访谈。全部节目可自由下载、转载与再制作。</p>
      </div>
      <div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: {{th.field}}; border: 1px solid {{th.border}}; font-size: 13px">
        <span style="background: {{th.onBg}}; color: {{th.onFg}}; padding: 7px 16px; border-radius: 999px">最新</span>
        <span style="color: {{th.chipFg}}; padding: 7px 16px">最热</span>
        <span style="color: {{th.chipFg}}; padding: 7px 16px">最早</span>
      </div>
    </div>
    <nav aria-label="视频系列" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
        <a href="#" style="display: flex; align-items: center; gap: 8px; font-size: 14px; text-decoration: none; padding: 9px 18px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.bd}}; font-weight: {{c.w}}">{{c.name}}<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.65">{{c.n}}</span></a>
      </sc-for>
    </nav>
  </header>

  <section style="position: relative; padding: 40px 96px 0; display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 24px">
    <a href="#" style="position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; color: #FFFFFF; text-decoration: none; box-shadow: {{th.shadow}}">
      <img src="{{lead.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,16,50,0) 40%, rgba(20,16,50,0.6) 65%, rgba(20,16,50,0.96) 100%)"></div>
      <span style="position: absolute; left: 50%; top: 40%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: rgba(255,255,255,0.95); color: #251E5E; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 0 0 12px rgba(255,255,255,0.16)">▶</span>
      <div style="position: absolute; left: 32px; right: 32px; bottom: 28px; display: flex; flex-direction: column; gap: 10px">
        <span style="display: flex; gap: 10px; align-items: center"><span style="background: #F2D38A; color: #1A1638; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 3px">最新一期</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #E6E1F8">{{lead.date}}</span></span>
        <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 900; font-size: 32px; line-height: 1.4">{{lead.t}}</span>
      </div>
    </a>
    <div style="display: flex; flex-direction: column; background: {{th.panel}}; border: 1px solid {{th.border}}; border-radius: 14px; padding: 20px 20px 8px; box-shadow: {{th.shadow}}">
      <span style="font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 18px; color: {{th.title}}; padding-bottom: 12px; border-bottom: 2px solid {{th.title}}">接着看</span>
      <sc-for list="{{side}}" as="s" hint-placeholder-count="3">
        <a href="#" style="display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: {{s.rule}}; color: {{th.text}}; text-decoration: none">
          <span style="display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 14px; align-items: start">
            <span style="position: relative; display: block; border-radius: 6px; overflow: hidden"><img src="{{s.img}}" alt="" style="width: 132px; aspect-ratio: 16 / 9; height: auto; object-fit: cover; display: block"><span style="position: absolute; left: 6px; bottom: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.9); color: #251E5E; display: flex; align-items: center; justify-content: center; font-size: 9px">▶</span></span>
            <span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 15px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{s.t}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{th.muted}}">{{s.date}}</span></span>
          </span>
        </a>
      </sc-for>
    </div>
  </section>

  <section style="position: relative; padding: 56px 96px 0; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid {{th.border}}">
      <span style="font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 24px; color: {{th.title}}">全部影片</span>
      <span style="font-size: 13px; color: {{th.muted}}">显示 1–16 / 241</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px 20px">
      <sc-for list="{{grid}}" as="v" hint-placeholder-count="12">
        <a href="#" style="display: flex; flex-direction: column; background: {{th.panel}}; border: 1px solid {{th.border}}; border-radius: 12px; overflow: hidden; color: {{th.text}}; text-decoration: none; box-shadow: {{th.shadow}}">
          <span style="position: relative; display: block">
            <img src="{{v.img}}" alt="" style="width: 100%; aspect-ratio: 16 / 9; height: auto; object-fit: cover; display: block">
            <span style="position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.92); color: #251E5E; display: flex; align-items: center; justify-content: center; font-size: 11px">▶</span>
            <sc-if value="{{v.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 10px; top: 10px; background: #F2D38A; color: #1A1638; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 3px">{{v.badge}}</span></sc-if>
          </span>
          <span style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; flex-grow: 1">
            <span style="font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 16px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 48px">{{v.t}}</span>
            <span style="margin-top: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{th.muted}}">{{v.date}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </section>

  <nav aria-label="分页" style="position: relative; margin: 48px 96px 96px; display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-radius: 12px; background: {{th.panel}}; border: 1px solid {{th.border}}">
    <span style="font-size: 13px; color: {{th.muted}}">第 1 / 11 页 · 共 241 部</span>
    <span style="display: flex; gap: 6px; align-items: center">
      <span style="padding: 9px 12px; font-size: 14px; color: {{th.muted}}; opacity: 0.6">← 上一页</span>
      <sc-for list="{{pages}}" as="p" hint-placeholder-count="6">
        <a href="#" style="min-width: 38px; height: 38px; padding: 0 6px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; text-decoration: none; background: {{p.bg}}; color: {{p.fg}}; border: 1px solid {{p.bd}}">{{p.n}}</a>
      </sc-for>
      <a href="#" style="padding: 9px 16px; font-size: 14px; text-decoration: none; background: {{th.onBg}}; color: {{th.onFg}}; border-radius: 8px; margin-left: 6px">下一页 →</a>
    </span>
  </nav>
</div>
</x-dc>
