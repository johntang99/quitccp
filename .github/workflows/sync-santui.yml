# Keeps the homepage 实时登记册 band current.
#
# The registry total and the 精彩推荐 declarations live on santui.tuidang.org,
# behind a Cloudflare challenge that only a real browser clears -- so they
# cannot be fetched from a Vercel route at request time. This job runs the
# browser on a schedule instead and writes a snapshot to Supabase, which the
# site reads. See scripts/sync-santui.ts.
#
# Measured rate: ~9,800 declarations a day against 466 million, so the figure
# shown on the homepage (4.66 亿) changes about three times a year. Six-hourly is
# already far finer than the data.
name: Sync santui registry

# The schedule moved to Vercel Cron (vercel.json -> /api/cron/santui), which
# drives a hosted browser over a WebSocket. GitHub's scheduled runs were missing
# several hours at a time, and GitHub disables schedules outright after 60 days
# with no commits. This workflow is kept, without a schedule, as the manual
# fallback: it runs the same script against a real browser on a real runner, so
# it still works if the hosted-browser vendor is down.
on:
  workflow_dispatch:

concurrency:
  group: sync-santui
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A whole run is seconds of work; anything past this is a stuck browser or
    # a challenge that will not clear, and the default six-hour ceiling would
    # just burn minutes and hold the concurrency group.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @supabase/supabase-js builds a realtime client on
          # createClient() and that needs a global WebSocket, which Node 20 does
          # not have -- it throws "Node.js detected but native WebSocket not
          # found" before the first write. supabase-js has also deprecated 20.
          node-version: 22
          cache: npm
      - run: npm install
      # Chromium only -- the script never needs the other engines.
      - run: npx playwright install --with-deps chromium
      - run: npm run sync:santui
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
